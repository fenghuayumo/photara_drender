[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "numpy>=1.23"]
build-backend = "scikit_build_core.build"

[project]
name = "aether-drender"
version = "0.4.0"
description = "Cross-platform differentiable rasterization using C++20 and Vulkan"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
baking = ["Pillow>=10.0", "trimesh>=4.0", "pynanoinstantmeshes>=0.0.3"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["python/asdiff_render"]

[tool.pytest.ini_options]
testpaths = ["tests"]
